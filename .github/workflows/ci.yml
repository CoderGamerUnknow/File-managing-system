name: CI

on:
  push:
    branches: [main]
    # A tag push alone does not run branch workflows, so without this a
    # release could be cut without the full matrix (ubuntu py3.9/py3.13 +
    # windows py3.13) ever seeing its code.
    tags: ["v*"]
  pull_request:
  # On-demand runs for any ref: this is how a specific commit gets a fresh
  # ubuntu (py3.9/py3.13) + windows (py3.13) result without pushing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
        include:
          # Guard the >=3.9 claim from pyproject.toml on one runner.
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        shell: bash
        run: python -m ruff check .

      - name: Run unit / regression tests
        # tee the output so a failure still leaves pytest.log behind for the
        # diagnostics steps below (PIPESTATUS preserves pytest's exit code).
        # shell: bash — PIPESTATUS is a bash builtin; the pwsh default on
        # Windows would read it as null and mask the failure.
        shell: bash
        run: |
          python -m pytest -v --tb=short 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      - name: Smoke test — dry-run + graceful shutdown
        shell: bash  # same PIPESTATUS masking hazard as the pytest step
        run: |
          python scripts/smoke_dryrun.py 2>&1 | tee smoke_dryrun.log
          exit ${PIPESTATUS[0]}

      - name: Smoke test — web dashboard
        shell: bash
        run: |
          python scripts/smoke_ui.py 2>&1 | tee smoke_ui.log
          exit ${PIPESTATUS[0]}

      - name: Commit diagnostics to ci-logs branch
        if: failure()
        shell: bash
        run: |
          BRANCH="ci-logs-${{ matrix.os }}-py${{ matrix.python-version }}"
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          mkdir -p ci-logs
          {
            echo "run: ${{ github.run_id }}  sha: ${{ github.sha }}"
            echo
            echo "======== pytest.log ========"
            cat pytest.log 2>/dev/null || echo "(missing)"
            echo
            echo "======== smoke_dryrun.log ========"
            cat smoke_dryrun.log 2>/dev/null || echo "(missing)"
            echo
            echo "======== smoke_ui.log ========"
            cat smoke_ui.log 2>/dev/null || echo "(missing)"
          } > "ci-logs/${{ matrix.os }}-py${{ matrix.python-version }}.txt"
          git add -f "ci-logs/${{ matrix.os }}-py${{ matrix.python-version }}.txt"
          git commit -m "CI diagnostics: ${{ matrix.os }} py${{ matrix.python-version }} run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/${BRANCH}" --force

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest.log
            smoke_*.log
          if-no-files-found: ignore
          retention-days: 7

  # Test what actually ships: build the sdist + wheel, then install EACH one
  # into a fresh venv and run the full suite against the installed package
  # (scripts/verify_artifact.sh stages the tests outside the repo so the
  # source tree cannot shadow site-packages). Without this job, only the
  # source tree was ever exercised — the artifacts users install were not.
  artifacts:
    name: Artifacts · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        shell: bash
        run: python -m build

      - name: Check metadata (twine)
        shell: bash
        run: python -m twine check --strict dist/*

      - name: Verify wheel (install + full suite against it)
        shell: bash
        run: bash scripts/verify_artifact.sh "dist/*.whl" wheel

      - name: Verify sdist (source build + full suite against it)
        shell: bash
        run: bash scripts/verify_artifact.sh "dist/*.tar.gz" sdist
