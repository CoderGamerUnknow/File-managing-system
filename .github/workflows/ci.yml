name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
        include:
          # Guard the >=3.9 claim from pyproject.toml on one runner.
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show environment
        run: python -c "import sys, watchdog, pytest; print(sys.version); print('watchdog', watchdog.__version__ if hasattr(watchdog, '__version__') else 'ok'); print('pytest', pytest.__version__)"

      - name: Run unit / regression tests
        run: python -m pytest -v --tb=short

      - name: Smoke test — dry-run + graceful shutdown
        run: python scripts/smoke_dryrun.py

      - name: Smoke test — web dashboard
        run: python scripts/smoke_ui.py
