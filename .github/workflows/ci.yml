name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
        include:
          # Guard the >=3.9 claim from pyproject.toml on one runner.
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit / regression tests
        run: python -m pytest -v --tb=short

      - name: Smoke test — dry-run + graceful shutdown
        run: |
          python scripts/smoke_dryrun.py 2>&1 | tee smoke_dryrun.log
          exit ${PIPESTATUS[0]}

      - name: Smoke test — web dashboard
        run: |
          python scripts/smoke_ui.py 2>&1 | tee smoke_ui.log
          exit ${PIPESTATUS[0]}

      - name: Commit diagnostics to ci-logs branch
        if: failure()
        shell: bash
        run: |
          BRANCH="ci-logs-${{ matrix.os }}-py${{ matrix.python-version }}"
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          mkdir -p ci-logs
          {
            echo "run: ${{ github.run_id }}  sha: ${{ github.sha }}"
            echo
            echo "======== smoke_dryrun.log ========"
            cat smoke_dryrun.log 2>/dev/null || echo "(missing)"
            echo
            echo "======== smoke_ui.log ========"
            cat smoke_ui.log 2>/dev/null || echo "(missing)"
          } > "ci-logs/${{ matrix.os }}-py${{ matrix.python-version }}.txt"
          git add -f "ci-logs/${{ matrix.os }}-py${{ matrix.python-version }}.txt"
          git commit -m "CI diagnostics: ${{ matrix.os }} py${{ matrix.python-version }} run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/${BRANCH}" --force

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            smoke_*.log
          if-no-files-found: ignore
          retention-days: 7
