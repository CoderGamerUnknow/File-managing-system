name: Release

# Builds, VERIFIES, and attaches installable artifacts for a version tag.
#
#   resolve  -> which tag (fails loudly if HEAD is not exactly a tag)
#   test     -> Linux quality gate on the source tree (lint, tests, smokes)
#   build    -> sdist + wheel, twine check, uploaded as a workflow artifact
#   verify   -> ubuntu AND windows: install each artifact into a fresh venv
#               and run the full suite against the INSTALLED package
#               (scripts/verify_artifact.sh) — the sdist goes through a real
#               source build on Linux, so nothing ships unexercised
#   attach   -> only after verify: gh release create/upload (--clobber)
#   publish  -> PyPI via trusted publishing; DORMANT until the repository
#               variable PYPI_PUBLISH is set to 'true' (see docs/RELEASING.md)
#
# Assets are attached ONLY after the Linux quality gate passes: a tag push
# does not run ci.yml (which watches branches), so without this gate a
# release could ship code no Linux runner has ever tested.
#
# Manual runs (`workflow_dispatch`) take a `tag` input, which is how an
# existing release gets back-filled with assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.4.1)"
        required: false
        default: ""

permissions:
  contents: write  # gh release create/upload uses the workflow token

jobs:
  # Single source of truth for "which tag are we releasing": a tag push gives
  # ref_name, a manual run gives the input. Fails loudly when HEAD is not
  # exactly a tag instead of silently packaging the wrong commit.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so tags are available
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Confirm the checkout is exactly a tag
        id: resolve
        shell: bash
        run: |
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "::error::HEAD is not exactly a tag. Pass 'tag' when running this workflow manually."
            exit 1
          fi
          echo "Releasing tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Linux quality gate
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run unit / regression tests
        shell: bash
        run: |
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      - name: Smoke test — dry-run + graceful shutdown
        shell: bash
        run: |
          python scripts/smoke_dryrun.py 2>&1 | tee smoke_dryrun.log
          exit ${PIPESTATUS[0]}

      - name: Smoke test — web dashboard
        shell: bash
        run: |
          python scripts/smoke_ui.py 2>&1 | tee smoke_ui.log
          exit ${PIPESTATUS[0]}

  build:
    name: Build artifacts
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata (twine)
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The gate that used to be a limitation: the sdist and the wheel are each
  # installed into a fresh venv on BOTH operating systems and the whole suite
  # is run against the installed package (source tree cannot shadow it).
  verify:
    name: Verify artifacts · ${{ matrix.os }}
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify wheel
        shell: bash
        run: bash scripts/verify_artifact.sh "dist/*.whl" wheel

      - name: Verify sdist (source build)
        shell: bash
        run: bash scripts/verify_artifact.sh "dist/*.tar.gz" sdist

  attach:
    name: Attach artifacts to the release
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release (if missing) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "Assets now on $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

  # Dormant by default: set the repository variable PYPI_PUBLISH=true (and
  # register this workflow as a trusted publisher on pypi.org — see
  # docs/RELEASING.md) to publish. Skipped otherwise, so tags stay green.
  publish:
    name: Publish to PyPI (trusted publishing)
    needs: [verify, build]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write  # OIDC exchange for a short-lived PyPI token
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
